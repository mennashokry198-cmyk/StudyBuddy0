<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Buddy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="cloudy.css">
<style
:root{--bg:#FFF7F2;--wash:radial-gradient(60rem 36rem at 0% 0%,#FCE3EC 0,transparent 60%),radial-gradient(50rem 32rem at 100% 10%,#EAE2FA 0,transparent 60%),radial-gradient(40rem 30rem at 50% 100%,#FBE9DD 0,transparent 60%);--card:#FFFDF9;--blush:#FCE9EF;--lav:#F0EAFB;--peach:#FBE9DD;--rose:#EFB6C8;--dusty:#DDA1B5;--lavs:#CBBBEF;--mint:#B9DDCC;--blue:#BBDCED;--yel:#F2E2A8;--t1:#514653;--t2:#8D8290;--t3:#B2A7B1;--ac:#75617A;--sh:0 8px 28px rgba(160,110,130,.13);--shs:0 3px 10px rgba(160,110,130,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--wash:none;--bg:#2A2330;--card:#352D3C;--blush:#3F2F3A;--lav:#352F45;--peach:#40332F;--t1:#F3E9F0;--t2:#BFB3BE;--t3:#8D8290;--ac:#DCC6E0;--sh:0 8px 28px rgba(0,0,0,.3);--shs:0 3px 10px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--wash),var(--bg);background-attachment:fixed;color:var(--t1);font:400 15px/1.55 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3,h4,.pop{font-family:Poppins,system-ui,sans-serif;font-weight:600;color:var(--t1)}
.hand{font-family:Caveat,cursive;font-weight:600;color:var(--dusty)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lavs);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:30px;font-weight:700;background:var(--rose);color:#5a3342;box-shadow:var(--shs);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}.btn:active{transform:scale(.96)}
.btn.s{background:var(--lav);color:var(--ac)}.btn.sm{padding:8px 16px;font-size:14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shs);padding:22px;transition:.25s}
.card.lift:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.tint{background:color-mix(in srgb,var(--c) 20%,var(--card))}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 38%,var(--card));color:var(--ac)}
.bar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--rose)) 25%,var(--card));overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--c,var(--rose));transition:width .8s cubic-bezier(.2,.8,.2,1)}
input,select,textarea{width:100%;padding:11px 15px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--lavs) 45%,transparent);background:var(--card)}
label{font-size:13px;font-weight:700;color:var(--t2);display:block;margin:12px 0 4px}
.muted{color:var(--t2);font-size:13px}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.g{display:grid;gap:18px}
.ico{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 55%,var(--card));color:var(--ac)}
/* landing */
.land{overflow-x:hidden}.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 6vw}
.logo{font:600 21px Poppins;display:flex;gap:8px;align-items:center}.logo b{color:var(--dusty)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:30px 6vw 80px}
.hero h1{font-size:clamp(36px,5.2vw,64px);line-height:1.08;margin:18px 0}
.pill{display:inline-block;padding:7px 16px;border-radius:30px;background:var(--blush);color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.08em}
.art{position:relative;height:460px;border-radius:200px 200px 40px 200px;background:linear-gradient(160deg,var(--blush),var(--lav) 60%,var(--peach))}
.art>*{position:absolute}.fl{animation:fl 6s ease-in-out infinite}.fl2{animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-12px) rotate(var(--r,0deg))}}
.note{width:130px;padding:14px;border-radius:6px;font:600 20px/1.2 Caveat;box-shadow:var(--shs);color:#5a4a58}
.sec{padding:80px 6vw}.sec h2{font-size:clamp(26px,3.4vw,40px);margin-bottom:10px}
.feat{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.steps{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.steps .n{font:700 44px Poppins;color:var(--c)}
.cta{margin:30px 6vw 60px;border-radius:40px;text-align:center;padding:70px 20px;background:linear-gradient(135deg,var(--blush),var(--lav))}
/* app */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;background:var(--card);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shs)}
.nv{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;color:var(--t2);font-weight:700;text-align:left;transition:.2s}
.nv:hover{background:var(--lav)}.nv.on{background:var(--blush);color:var(--ac)}
.me{margin-top:auto;padding:12px;border-radius:20px;background:var(--lav)}
.av{width:38px;height:38px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font:600 16px Poppins;color:#5a3342}
main{padding:30px clamp(16px,3vw,40px) 90px;max-width:1200px;width:100%}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;align-items:center}
.top h1{font-size:clamp(24px,3vw,32px)}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.stat b{font:700 38px Poppins;display:block;line-height:1.1;margin:10px 0 2px}
.two{grid-template-columns:1.4fr 1fr}.sg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.add{border:2px dashed var(--lavs);background:transparent;box-shadow:none;display:grid;place-items:center;min-height:190px;color:var(--ac);font-weight:700;cursor:pointer}
.tk{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed color-mix(in srgb,var(--t3) 40%,transparent)}.tk:last-child{border:0}
.ck{width:22px;height:22px;border-radius:8px;border:2px solid var(--mint);flex:none}.ck.on{background:var(--mint)}
.kan{grid-template-columns:repeat(3,1fr);align-items:start}
.col{border-radius:26px;padding:14px;min-height:300px;transition:.2s}.col.over{outline:2px dashed var(--lavs);transform:scale(1.01)}
.col h3{font-size:15px;padding:6px 8px 12px}
.kc{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shs);cursor:grab;transition:.2s}.kc:hover{transform:translateY(-2px)}.kc.drag{opacity:.4}.kc.pop{animation:pp .45s}
@keyframes pp{0%{transform:scale(.9)}60%{transform:scale(1.04)}}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:6px 14px;border-radius:20px;background:var(--lav);font-weight:700;font-size:13px;color:var(--ac)}.chip.on{background:var(--rose);color:#5a3342}
.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{padding:9px 18px;border-radius:20px;font-weight:700;color:var(--t2)}.tabs .on{background:color-mix(in srgb,var(--c) 45%,var(--card));color:var(--ac)}
.tabc{animation:fi .35s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.timer{display:grid;place-items:center;text-align:center;padding:40px 20px;background:linear-gradient(160deg,var(--blush),var(--lav))}
.ringw{position:relative;width:min(320px,80vw);aspect-ratio:1}.ringw svg{transform:rotate(-90deg);width:100%;height:100%}
.ringw .c{position:absolute;inset:0;display:grid;place-content:center}.ringw b{font:600 64px Poppins;color:var(--ac)}
.notes{grid-template-columns:280px 1fr;align-items:start}
.ni{padding:12px 14px;border-radius:16px;cursor:pointer;margin-bottom:6px;background:color-mix(in srgb,var(--c) 18%,var(--card))}.ni.on{box-shadow:0 0 0 2px var(--c)}
.ed{min-height:340px;resize:vertical;background:repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--lavs) 30%,transparent) 27px 28px);line-height:28px}
.ov{position:fixed;inset:0;background:rgba(81,70,83,.35);display:grid;place-items:center;z-index:50;animation:fi .2s;padding:16px}
.md{background:var(--card);border-radius:30px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;animation:fi .3s}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw label{margin:0}.sw input{display:none}.sw span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);cursor:pointer}.sw input:checked+span{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ac)}
#ai{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40}
#aib{width:64px;height:64px;border-radius:50%;background:var(--lav);box-shadow:var(--sh);display:grid;place-items:center;animation:fl 5s ease-in-out infinite}
#aip{display:none;position:absolute;right:0;bottom:78px;width:min(360px,calc(100vw - 32px));height:480px;background:var(--card);border-radius:28px;box-shadow:0 16px 50px rgba(120,80,110,.25);flex-direction:column;overflow:hidden}
#aip.open{display:flex;animation:fi .3s}.ah{padding:16px 18px;background:linear-gradient(135deg,var(--blush),var(--lav))}
#ms{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:14px}.m.a{background:var(--lav);border-bottom-left-radius:6px}.m.u{background:var(--rose);color:#4a2a38;align-self:flex-end;border-bottom-right-radius:6px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--card);padding:12px 22px;border-radius:30px;box-shadow:var(--sh);font-weight:700;animation:fi .3s}
@media(max-width:860px){.hero,.two,.notes,.kan{grid-template-columns:1fr}.art{height:380px}.app{grid-template-columns:1fr}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;z-index:30;padding:8px;justify-content:space-around}.side .nv span,.side .me,.side .logo{display:none}.nv{padding:10px 14px}main{padding-bottom:110px}#ai{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shs);color:var(--ac);position:relative;transition:.25s}.ib:hover{transform:translateY(-2px) rotate(-8deg);background:var(--blush)}.ib.sm{width:34px;height:34px}
.nd{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--card)}
.util{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.sb{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:30px;padding:0 16px;box-shadow:var(--shs);min-width:230px;color:var(--t3)}.sb input{border:0;background:none;padding:10px 0;outline:0}
.btn{background:linear-gradient(135deg,#F7C9D8,#EFB6C8 55%,#E8A6BE)}.btn.s{background:linear-gradient(135deg,var(--lav),color-mix(in srgb,var(--lavs) 45%,var(--card)));color:var(--ac)}
.card{border:1px solid color-mix(in srgb,var(--rose) 18%,transparent)}.card.lift:hover{transform:translateY(-6px)}
.stat{position:relative;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 38%,var(--card)),var(--card) 85%)}.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--c) 40%,transparent);opacity:.55}.stat b{font-size:42px}
.side{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--blush) 55%,var(--card)))}.nv.on{background:linear-gradient(135deg,var(--blush),var(--lav));box-shadow:var(--shs)}
.sg .card.lift:hover{transform:translateY(-6px) rotate(-.6deg)}.tabs .on{box-shadow:var(--shs)}
.kc{border-left:4px solid var(--rose)}.kc.drag{transform:rotate(3deg) scale(1.03);box-shadow:var(--sh)}.col{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.ringw{filter:drop-shadow(0 14px 30px rgba(203,187,239,.55))}.ringw b{background:linear-gradient(135deg,#DDA1B5,#9C84C9);-webkit-background-clip:text;background-clip:text;color:transparent}.btn[data-a=tog2]{padding:16px 44px;font-size:17px}
#aib{background:linear-gradient(145deg,#FCE9EF,#CBBBEF);animation:fl 5s ease-in-out infinite,gl 3s infinite}@keyframes gl{50%{box-shadow:0 0 0 12px rgba(203,187,239,.25),var(--sh)}}
.m.a{background:linear-gradient(135deg,var(--lav),color-mix(in srgb,var(--lavs) 30%,var(--card)))}.m.u{background:linear-gradient(135deg,#F7C9D8,#EFB6C8)}.m{animation:fi .3s}
.art::before,.art::after{content:"";position:absolute;border-radius:50%}.art::before{width:260px;height:260px;right:-30px;bottom:-30px;background:color-mix(in srgb,var(--peach) 90%,transparent)}.art::after{width:150px;height:150px;left:-20px;top:30%;background:color-mix(in srgb,var(--blue) 55%,transparent)}.art>*{z-index:1}
.drop{border:2px dashed var(--lavs);border-radius:28px;padding:34px 20px;text-align:center;display:grid;gap:8px;justify-items:center;background:linear-gradient(145deg,var(--lav),var(--card));transition:.25s}.drop.over{transform:scale(1.015);border-color:var(--rose);background:var(--blush)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.fc{display:flex;gap:14px;padding:16px}.ft{width:54px;height:64px;border-radius:14px;display:grid;place-items:center;font:700 13px Poppins;color:#5a4a58;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 45%,var(--card)));flex:none}
.fn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.up{margin:12px 0}
.lw{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px clamp(10px,2vw,28px);background:var(--wash),var(--bg);overflow:hidden}
.lh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:10px 14px;box-shadow:var(--shs)}
.tb{position:relative;margin-top:10px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 18px;border-radius:30px;background:linear-gradient(135deg,var(--blush),var(--lav));box-shadow:var(--sh)}
.lv{flex:1;min-height:0;margin-top:10px;border-radius:24px;overflow:auto;background:color-mix(in srgb,var(--lavs) 22%,var(--bg));padding:24px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lavs) 30%,transparent)}.lv.tint2{background:#F6EBD3}
.lv canvas{display:block;margin:0 auto;border-radius:6px;background:#fff;box-shadow:var(--sh)}
.slide,.doc{max-width:880px;margin:0 auto;background:var(--card);border-radius:24px;padding:36px;box-shadow:var(--sh);min-height:60%}.doc img{max-width:100%}.doc table{border-collapse:collapse}.doc td{border:1px solid var(--t3);padding:4px 8px}
.xp{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);z-index:20;min-width:240px;gap:10px}.xp.show{display:grid;animation:fi .25s}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35}#mini .xp{top:auto;bottom:calc(100% + 10px)}
.mp{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;border-radius:30px;background:linear-gradient(135deg,var(--blush),var(--lav));box-shadow:var(--sh)}.mp b{font-size:20px}.mbar{height:4px;margin:4px 18px 0;border-radius:4px;background:color-mix(in srgb,var(--lavs) 30%,transparent);overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--lavs));transition:width 1s linear}
.m.n{align-self:center;background:none;color:var(--t2);font-size:12px;padding:2px}.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--ac);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px);opacity:.5}}
@media(max-width:860px){#mini{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.emp{display:grid;justify-items:center;text-align:center;gap:6px;padding:34px 18px;border-radius:28px;background:linear-gradient(160deg,var(--blush),var(--lav) 70%,var(--card));box-shadow:var(--shs)}.emp h3{font-size:19px}.emp .btn{margin-top:12px}.emp p{max-width:340px}
</style></head><body>
<div id="root"></div><div id="mini"></div><div id="ai"><div id="aip"><div class="ah row sp"><div class="row"><span id="mas2"></span><div><h4>Cloudy</h4><div class="muted">Your study helper</div></div></div><span class="row" style="gap:8px"><button data-a="aicfg" aria-label="AI settings"></button><button data-a="chat" aria-label="Close"></button></span></div><div id="ms"></div><div class="row" style="padding:12px"><input id="ci" placeholder="Ask about a lecture or concept…"><button class="btn sm" data-a="send" aria-label="Send"></button></div></div><button id="aib" data-a="chat" aria-label="Open study assistant"></button></div>
<script>
const P={home:"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",book:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5",list:"M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01",timer:"M12 8v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M9 1h6",note:"M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h5",search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M21 21l-5-5",plus:"M12 5v14M5 12h14",x:"M6 6l12 12M18 6 6 18",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",spark:"M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z",send:"M4 12 20 4l-6 16-3-7z",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",check:"M5 12l5 5 9-10",chart:"M4 20V10M10 20V4M16 20v-8M22 20H2",gear:"M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3",sun:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5",moon:"M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z",up:"M12 16V4M7 9l5-5 5 5M4 16v4h16v-4",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6",dl:"M12 4v12M7 11l5 5 5-5M4 20h16",play:"M7 4l13 8-13 8z",pause:"M8 4v16M16 4v16",rst:"M4 12a8 8 0 1 0 3-6.2M4 4v5h5",max:"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5",back:"M15 5l-7 7 7 7",zin:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M21 21l-5-5M8 11h6M11 8v6",zout:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M21 21l-5-5M8 11h6"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

else if(k==='doc'){await SRC(LIB.mam);const r=await mammoth.convertToHtml({arrayBuffer:await buf()});LV.html=r.value;const d=document.createElement('div');d.innerHTML=r.value;LV.text=d.textContent}
else if(k==='ppt'){await SRC(LIB.zip);const z=await JSZip.loadAsync(await buf()),ns=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
for(const n of ns){const x=await z.file(n).async('string');LV.pages.push([...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')).join('\n'))}LV.n=ns.length||1}
else LV.src=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f.blob)})}catch(x){LV.err='The document viewer could not load. Check your connection and try again.'}
LV.busy=false;if(V.page==='lec'&&LV.id===id){lecDraw();if(k==='pdf')for(let i=1;i<=LV.n&&LV.id===id;i++){try{const c=await(await LV.pdf.getPage(i)).getTextContent();LV.pages[i-1]=c.items.map(x=>x.str).join(' ')}catch(_){}}}}
/* files */
const themeIcon=()=>ic(document.documentElement.dataset.theme==='dark'?'sun':'moon');
let LF=[],UP={};const OK=['pdf','ppt','pptx','doc','docx','png','jpg','jpeg','gif','webp'];
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('studybuddy-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(x){no(x)}});
const idb=async(m,fn)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)})};
const FT={pdf:['PDF','#DDA1B5'],ppt:['PPT','#F2C5AD'],pptx:['PPT','#F2C5AD'],doc:['DOC','#BBC9F1'],docx:['DOC','#BBC9F1']};['png','jpg','jpeg','gif','webp'].forEach(x=>FT[x]=['IMG','#B9DDCC']);
const fsz=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
function upload(files,sid){[...files].forEach(f=>{const ext=(f.name.split('.').pop()||'').toLowerCase();
if(!OK.includes(ext))return toast('Unsupported file: '+f.name+'. Use PDF, PowerPoint, Word or image files');
if(f.size>26214400)return toast(f.name+' is larger than 25 MB');
const id=uid()+uid(),r=new FileReader();UP[id]={sid,name:f.name,p:0};
r.onprogress=x=>{if(x.lengthComputable){UP[id].p=Math.round(x.loaded/x.total*90);render()}};
r.onerror=()=>{delete UP[id];toast('Could not read '+f.name);render()};
r.onload=async()=>{try{const rec={id,sid,name:f.name,ext,size:f.size,type:f.type,date:Date.now(),blob:new Blob([r.result],{type:f.type||''})};await idb('readwrite',st=>st.put(rec));LF.push(rec);UP[id].p=100;render();setTimeout(()=>{delete UP[id];render();toast('Uploaded '+f.name+' ✓')},400)}catch(err){delete UP[id];toast('Could not save '+f.name+'. Browser storage may be full');render()}};
r.readAsArrayBuffer(f)})}
function lectures(s){const q=V.lq.toLowerCase(),L=LF.filter(f=>f.sid===s.id&&f.name.toLowerCase().includes(q)).sort((a,b)=>b.date-a.date),U=Object.values(UP).filter(u=>u.sid===s.id);
return `<div class="drop" id="dz"><div class="ico" style="--c:${s.c}">${ic('up')}</div><h3>Drop your lectures here</h3><p class="muted">PDF, PowerPoint, Word or images, up to 25 MB each</p><button class="btn sm" data-a="pick">Browse files</button><input type="file" id="fi" multiple hidden accept=".pdf,.ppt,.pptx,.doc,.docx,image/*"></div>
${U.map(u=>`<div class="card up"><div class="row sp"><span>${e(u.name)}</span><b>${u.p}%</b></div><div class="bar" style="--c:${s.c}"><i style="width:${u.p}%"></i></div></div>`).join('')}
<div class="row sp" style="margin:22px 0 14px;flex-wrap:wrap"><h3>Library <span class="muted">${L.length} file${L.length===1?'':'s'}</span></h3><div class="sb">${ic('search')}<input id="lq" placeholder="Search lectures" value="${e(V.lq)}" aria-label="Search lectures"></div></div>
<div class="fg">${L.map(f=>{const t=FT[f.ext];return `<div class="card lift fc"><div class="ft" style="--c:${t[1]}">${t[0]}</div><div style="min-width:0;flex:1"><b class="fn" title="${e(f.name)}" style="font-weight:600">${e(f.name)}</b><div class="muted">${f.ext.toUpperCase()} · ${fsz(f.size)} · ${new Date(f.date).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}</div><div class="row" style="margin-top:10px;gap:8px"><button class="ib sm" data-a="prev" data-id="${f.id}" aria-label="Preview">${ic('eye')}</button><button class="ib sm" data-a="dl" data-id="${f.id}" aria-label="Download">${ic('dl')}</button><button class="ib sm" data-a="dfile" data-id="${f.id}" aria-label="Delete file">${ic('trash')}</button></div></div></div>`}).join('')||`${q?'<p class="muted">No lectures match your search.</p>':'<div style="grid-column:1/-1">'+empty('lec')+'</div>'}`}</div>`}
async function preview(id){const f=LF.find(x=>x.id===id);if(!f)return;const img=['png','jpg','jpeg','gif','webp'].includes(f.ext);
const u=img?await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f.blob)}):URL.createObjectURL(f.blob);
const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md" style="width:min(860px,100%)"><div class="row sp"><h3 style="font-size:17px">${e(f.name)}</h3><button data-x aria-label="Close">${ic('x')}</button></div><div style="margin-top:14px">${img?`<img src="${u}" alt="${e(f.name)}" style="max-width:100%;max-height:70vh;border-radius:16px;display:block;margin:auto">`:f.ext==='pdf'?`<iframe src="${u}" title="${e(f.name)}" style="width:100%;height:70vh;border:0;border-radius:16px;background:#fff"></iframe><p class="muted" style="margin-top:8px">If the preview stays blank, download the file to read it.</p>`:`<p class="muted">Word and PowerPoint files can't be previewed in the browser. Download the file to open it.</p>`}</div></div>`;
o.onclick=ev=>{if(ev.target===o||ev.target.closest('[data-x]')){o.remove();img||URL.revokeObjectURL(u)}};document.body.append(o)}
async function dl(id){const f=LF.find(x=>x.id===id);try{const d=await claude.use('downloads');if(!d)throw{code:'unavailable'};await d.save({filename:f.name,data:f.blob});toast('Saved '+f.name)}catch(x){toast(x&&x.code==='rejected_extension'?'Old .doc and .ppt files can\'t be saved from here. Convert to .docx or .pptx':x&&x.code==='declined'?'Download cancelled':'Downloads work when this page is opened in Claude')}}
const hasF=ev=>ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files');
document.addEventListener('dragover',ev=>{if(!hasF(ev))return;ev.preventDefault();const z=ev.target.closest&&ev.target.closest('#dz');document.querySelectorAll('#dz').forEach(x=>x.classList.toggle('over',x===z))});
document.addEventListener('dragleave',ev=>{if(!ev.relatedTarget)document.querySelectorAll('#dz').forEach(x=>x.classList.remove('over'))});
document.addEventListener('drop',ev=>{if(!hasF(ev))return;ev.preventDefault();document.querySelectorAll('#dz').forEach(x=>x.classList.remove('over'));if(ev.target.closest&&ev.target.closest('#dz')&&V.page==='sub')upload(ev.dataTransfer.files,V.sid);else toast('Drop files onto the upload area')});
document.addEventListener('change',ev=>{if(ev.target.id==='fi'){upload(ev.target.files,V.sid);ev.target.value=''}});
/* AI */
document.getElementById('aib').innerHTML=mas(46);document.getElementById('mas2').innerHTML=mas(38);document.querySelector('[data-a=chat][aria-label=Close]').innerHTML=ic('x');document.querySelector('[data-a=send]').innerHTML=ic('send');
const C=[{r:'a',t:'Hi! I\'m Cloudy ♡ Ask me to explain a concept, summarise a lecture or quiz you with practice questions.'}];
const chips=()=>(V.page==='lec'?['Explain this page simply','Summarize this lecture','Key points','Generate 5 MCQs','Revision questions','Explain difficult terms']:['Explain a concept','Make revision questions','Study tips']).map(x=>`<button class="chip" data-a="chip" data-id="${e(x)}">${e(x)}</button>`).join('');
function drawC(){const m=document.getElementById('ms');m.innerHTML=C.map(x=>x.r==='n'?`<div class="m n">${e(x.t)}</div>`:`<div class="m ${x.r}">${x.t?e(x.t):'<span class="dots"><i></i><i></i><i></i></span>'}</div>`).join('')+`<div class="chips" style="margin:4px 0 0">${chips()}</div>`;m.scrollTop=m.scrollHeight}
const EP=()=>{try{return localStorage.getItem('sb-ai-endpoint')||''}catch(_){return''}};
function ctx(){if(V.page!=='lec'||!LV.id)return'';const f=LF.find(x=>x.id===LV.id);if(!f)return'';const pg=LV.kind==='pdf'||LV.kind==='ppt',cur=pg?(LV.pages[LV.pg-1]||''):'',all=LV.kind==='doc'?LV.text:LV.pages.map((t,i)=>'[Page '+(i+1)+'] '+(t||'')).join('\n');
return ' The student is reading the lecture "'+f.name+'" for the subject "'+sub(f.sid).n+'". Other materials in this subject: '+(LF.filter(x=>x.sid===f.sid&&x.id!==f.id).map(x=>x.name).join(', ')||'none')+'. They are on page '+LV.pg+' of '+LV.n+'. Text of the current page: +cur.slice(0,3000)+ Lecture text, possibly truncated: +all.slice(0,14000)+ '+(all.trim()?'Base answers on this text and say when something is not in it.':'No readable text could be extracted from this file (it may be an image or a scan); tell the student you cannot read its content.')}
async function llm(sys,msgs,on){const ep=EP();if(ep){const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,messages:msgs})});if(!r.ok)throw new Error('http');on((await r.json()).text||'');return}
let sm=null;try{sm=await claude.use('sample')}catch(_){}if(!sm)throw{code:'noai'};await sm(msgs.map((m,k)=>({role:m.role,content:(k===0?sys+'\n\nStudent: ':'')+m.content})),{cache:false,onText:({text})=>on(text)})}
async function ask(){const i=document.getElementById('ci'),q=i.value.trim();if(!q||ask.busy)return;i.value='';C.push({r:'u',t:q});const bot={r:'a',t:''};C.push(bot);drawC();ask.busy=1;
const sys='You are Cloudy, a warm, concise study companion for a university student. Explain clearly with short paragraphs and simple examples. Plain text only, no markdown.'+ctx();
const h=C.filter(x=>x.r!=='n').slice(0,-1).slice(-12).map(x=>({role:x.r==='u'?'user':'assistant',content:x.t}));while(h.length&&h[0].role==='assistant')h.shift();
try{await llm(sys,h,t=>{bot.t=t;drawC()})}catch(x){bot.t=x&&x.code==='noai'?'Cloudy has no AI backend yet. Tap the gear above and paste your endpoint URL (setup is in ai-proxy.js). Your API key stays on your server.':'I could not reach the AI endpoint. Pages published on Claude block requests to other sites, so the assistant needs this page hosted on your own site, or opened in Claude.'}
ask.busy=0;drawC()}
document.querySelector('[data-a=aicfg]').innerHTML=ic('gear');
try{if(localStorage.getItem('sb-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(_){}
drawC();render();idb('readonly',st=>st.getAll()).then(r=>{LF=r||[];LF.forEach(f=>{if(DS[f.sid]&&!S.subs.some(x=>x.id===f.sid)){S.subs.push({id:f.sid,n:DS[f.sid][0],d:'',c:DS[f.sid][1]});save()}});render()}).catch(()=>{});
</script></body></html>
